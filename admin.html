<!doctype html>
<html lang="ko">
<head>
<meta name="google-site-verification" content="x3d7na5m6vzDfP7_YZDrYXnT3PAOn9FWX9C45uWVJGg" />
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kyoto After Dark · Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<style>
:root{--paper:#f4efe3;--card:#fffdf7;--ink:#302c25;--muted:#81796b;--line:#e4dccb;--accent:#b85f43;--green:#55735b;--shadow:0 12px 36px #51452b12}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{max-width:1120px;margin:auto;padding:34px 22px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:800}.brand{font-family:Georgia,serif;font-size:27px;margin:7px 0 0}.sub{color:var(--muted);font-size:13px;margin-top:7px}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn:disabled{opacity:.5;cursor:wait}.panel,.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.login{max-width:420px;margin:9vh auto;padding:28px}.login h2{font-family:Georgia,serif;font-weight:500}.field{display:block;width:100%;padding:13px 14px;margin:9px 0 14px;border:1px solid var(--line);border-radius:10px;background:#fffefa;font-size:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{padding:19px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:8px;font-weight:750}.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0}.toolbar input{flex:1;min-width:0;margin:0}.tablebox{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px}.table th{font-size:11px;color:var(--muted);letter-spacing:.06em;background:#faf6ed}.table tr:last-child td{border-bottom:0}.name{font-weight:750}.meta{color:var(--muted);font-size:12px;margin-top:4px}.pill{display:inline-block;padding:4px 8px;border-radius:30px;background:#edf1e8;color:var(--green);font-size:11px}.status{font-size:13px;color:var(--muted);min-height:20px;margin:12px 0}.hidden{display:none!important}.foot{color:var(--muted);font-size:12px;margin-top:18px;line-height:1.7}.empty{text-align:center;padding:40px;color:var(--muted)}@media(max-width:650px){.wrap{padding:24px 14px 50px}.top{align-items:flex-start}.brand{font-size:23px}.stats{grid-template-columns:1fr}.stat{padding:14px}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}}
</style></head>
<body>
<div id="loginView" class="login panel">
  <div class="eyebrow">KYOTO AFTER DARK</div><h2>관리자 로그인</h2><p class="sub">사이트에 가입한 관리자 계정으로 로그인해 주세요.</p>
  <form id="loginForm"><label class="sub" for="email">이메일</label><input class="field" id="email" type="email" autocomplete="username" required><label class="sub" for="password">비밀번호</label><input class="field" id="password" type="password" autocomplete="current-password" required><button class="btn primary" style="width:100%" id="loginBtn">로그인</button></form><div id="loginStatus" class="status" role="status"></div>
</div>
<main id="adminView" class="wrap hidden">
  <header class="top"><div><div class="eyebrow">KYOTO AFTER DARK / CONTROL ROOM</div><h1 class="brand">Member Directory</h1><div class="sub">가입 회원과 프로필을 확인하는 관리자 전용 공간</div></div><button class="btn" id="logoutBtn">로그아웃</button></header>
  <section class="stats"><div class="stat"><small>전체 가입자</small><strong id="totalCount">—</strong></div><div class="stat"><small>최근 7일 가입</small><strong id="weekCount">—</strong></div><div class="stat"><small>최근 30일 가입</small><strong id="monthCount">—</strong></div></section>
  <section class="panel" style="overflow:hidden"><div style="padding:18px 18px 0"><div style="font-weight:800">회원 목록</div><div class="sub">이메일, 닉네임, 가입일, 마지막 로그인</div><div class="toolbar"><input id="search" class="field" placeholder="닉네임 또는 이메일 검색"><button id="refreshBtn" class="btn">새로고침</button></div><div id="status" class="status" role="status"></div></div><div class="tablebox"><table class="table"><thead><tr><th>회원</th><th>가입일</th><th>마지막 로그인</th><th>가입 방식</th><th>프로필</th></tr></thead><tbody id="membersBody"><tr><td colspan="5" class="empty">회원 정보를 불러오는 중…</td></tr></tbody></table></div></section>
  <div class="foot">개인정보 보호를 위해 관리자만 접근할 수 있습니다. 회원 이메일과 로그인 정보는 관리자 화면 밖으로 공유하지 마세요.</div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const loginView=$('loginView'), adminView=$('adminView');
  let client, members=[];
  const fmt = value => value ? new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value)) : '기록 없음';
  function status(el,msg,isError=false){el.textContent=msg;el.style.color=isError?'#b34435':'var(--muted)'}
  function showAdmin(show){loginView.classList.toggle('hidden',show);adminView.classList.toggle('hidden',!show)}
  function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function render(){const q=$('search').value.trim().toLowerCase();const filtered=members.filter(m=>(m.email||'').toLowerCase().includes(q)||(m.nickname||'').toLowerCase().includes(q));$('membersBody').innerHTML=filtered.length?filtered.map(m=>`<tr><td><div class="name">${escapeHtml(m.nickname||'닉네임 미설정')}</div><div class="meta">${escapeHtml(m.email||'이메일 정보 없음')}</div><div class="meta">${escapeHtml(m.id)}</div></td><td>${fmt(m.created_at)}</td><td>${fmt(m.last_sign_in_at)}</td><td><span class="pill">${escapeHtml(m.provider||'email')}</span></td><td>${m.profile?'프로필 있음':'미작성'}</td></tr>`).join(''):`<tr><td colspan="5" class="empty">검색 결과가 없습니다.</td></tr>`}
  async function loadMembers(){ $('refreshBtn').disabled=true;status($('status'),'회원 목록을 불러오는 중…');try{const {data,error}=await client.functions.invoke('kyd-admin-members',{body:{}});if(error)throw error;members=data.members||[];$('totalCount').textContent=Number(data.total??members.length).toLocaleString('ko-KR');const now=Date.now(),week=now-7*86400000,month=now-30*86400000;$('weekCount').textContent=members.filter(m=>new Date(m.created_at).getTime()>=week).length.toLocaleString('ko-KR');$('monthCount').textContent=members.filter(m=>new Date(m.created_at).getTime()>=month).length.toLocaleString('ko-KR');render();status($('status'),`총 ${members.length.toLocaleString('ko-KR')}명의 회원 정보를 불러왔습니다.`)}catch(e){console.error(e);status($('status'),e.message||'회원 정보를 불러오지 못했습니다. Edge Function 배포와 관리자 UID 설정을 확인해 주세요.',true)}finally{$('refreshBtn').disabled=false}}
  async function init(){if(!window.SUPABASE_URL||!window.SUPABASE_PUBLISHABLE_KEY){status($('loginStatus'),'supabase-config.js에서 프로젝트 URL과 Publishable Key를 확인해 주세요.',true);return}client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY,{auth:{storageKey:'kyoto-community-auth',autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}});const {data}=await client.auth.getSession();if(data.session){showAdmin(true);await loadMembers()}else showAdmin(false)}
  $('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;status($('loginStatus'),'로그인 중…');try{const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;showAdmin(true);await loadMembers()}catch(e){status($('loginStatus'),e.message||'로그인에 실패했습니다.',true)}finally{$('loginBtn').disabled=false}});
  $('logoutBtn').addEventListener('click',async()=>{await client.auth.signOut();showAdmin(false);status($('loginStatus'),'로그아웃했습니다.')});$('refreshBtn').addEventListener('click',loadMembers);$('search').addEventListener('input',render);init();
})();
</script></body></html>
