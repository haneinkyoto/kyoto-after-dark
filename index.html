<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교토 술집 지도 | My Kyoto Izakaya Map</title>

  <!-- External Libraries & Fonts -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;700&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       1. GLOBAL VARIABLES & RESET
       ========================================= */
    :root {
      --ink: #20221d;
      --muted: #817b73;
      --paper: #f7f6f0;
      --card: #fffefa;
      --accent: #a64032;
      --line: #e7e0d6;
      --green: #68745b;
      --shadow: 0 12px 32px rgba(37, 35, 31, 0.06);
      --night-accent: #c8ff3d;
      --night-ink: #20221d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Manrope", "Noto Sans KR", "Noto Sans JP", sans-serif;
      letter-spacing: -0.015em;
      line-height: 1.65;
    }

    h1, h2, h3, h4 {
      font-family: "Manrope", "Noto Sans KR", "Noto Sans JP", sans-serif;
      font-weight: 600;
      letter-spacing: -0.035em;
    }

    /* =========================================
       2. UI COMPONENTS & BUTTONS
       ========================================= */
    button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 16px;
      border: 1px solid var(--ink);
      border-radius: 4px;
      background: var(--ink);
      color: #fffefa;
      font-family: inherit;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }

    button:hover, .button:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }

    button.secondary:hover {
      background: #eee8df;
      border-color: #cfc4b7;
      color: var(--ink);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* =========================================
       3. HEADER & BRANDING
       ========================================= */
    header {
      padding: 24px clamp(18px, 4vw, 56px) 22px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand small {
      display: block;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 10px;
      color: var(--accent);
      font-weight: 800;
      margin-bottom: 5px;
    }

    h1 {
      font-size: clamp(27px, 4vw, 43px);
      font-weight: 900;
      margin: 0;
      letter-spacing: -0.075em;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 7px;
      letter-spacing: -0.02em;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }

    /* =========================================
       4. MAIN LAYOUT & SIDEBAR
       ========================================= */
    main {
      display: grid;
      grid-template-columns: minmax(280px, 350px) 1fr;
      min-height: calc(100vh - 100px);
      background: var(--paper);
    }

    .sidebar {
      padding: 24px;
      border-right: 1px solid var(--line);
      background: var(--paper);
      overflow: auto;
      max-height: calc(100vh - 100px);
    }

    .search, input.search {
      width: 100%;
      min-height: 46px;
      padding: 12px 15px;
      border: 1px solid #e5e3da;
      border-radius: 5px;
      background: #fffefa;
      color: #262720;
      font-family: inherit;
      font-size: 13px;
      text-align: center;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search::placeholder, input.search::placeholder {
      color: #969387;
      text-align: center;
    }

    .search:focus, input.search:focus {
      border-color: #929b6c;
      outline: none;
      box-shadow: 0 0 0 3px rgba(146, 155, 108, 0.15);
    }

    .place-filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0 0 16px;
      justify-items: center;
    }

    .place-filters select {
      width: 100%;
      min-width: 0;
      padding: 11px 9px;
      border: 1px solid #e5e3da;
      border-radius: 5px;
      background: #fffefa;
      color: #39392f;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      text-align-last: center;
    }

    .place-filters select:focus {
      outline: none;
      border-color: #929b6c;
      box-shadow: 0 0 0 3px rgba(146, 155, 108, 0.15);
    }

    .stats {
      display: flex;
      gap: 10px;
      margin: 0 0 20px;
      justify-content: center;
      text-align: center;
    }

    .stat {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 14px;
      background: #eceee4;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -0.06em;
    }

    .stat span {
      font-size: 9px;
      color: var(--muted);
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #77786c;
      margin: 26px 0 12px;
    }

    /* =========================================
       5. PLACE CARDS & LISTS
       ========================================= */
    .place-list {
      display: grid;
      gap: 10px;
    }

    .place-card {
      background: #fffefa;
      border: 1px solid #e5e3da;
      border-radius: 5px;
      padding: 16px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(37, 37, 29, 0.02);
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .place-card:hover {
      border-color: #aeb58f;
      transform: translateY(-2px);
      box-shadow: 0 5px 14px rgba(37, 37, 29, 0.05);
    }

    .place-card.active {
      border-color: #929b6c;
      box-shadow: inset 3px 0 0 #929b6c;
    }

    .place-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .place-name {
      font-size: 15px;
      font-weight: 800;
      color: #262720;
      letter-spacing: -0.035em;
      line-height: 1.5;
    }

    .rating {
      font-size: 12px;
      color: #777d58;
      white-space: nowrap;
    }

    .place-meta {
      font-size: 11px;
      color: #858478;
      margin-top: 5px;
      line-height: 1.7;
    }

    .place-note {
      font-size: 12px;
      line-height: 1.8;
      margin-top: 11px;
      color: #55564d;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .place-card img {
      border-radius: 3px !important;
      margin: 12px 0 !important;
    }

    .tag {
      display: inline-block;
      font-size: 10px;
      border: 1px solid #e1e2d7;
      border-radius: 3px;
      padding: 4px 7px;
      margin: 7px 4px 0 0;
      background: #f0f1e9;
      color: #555c42;
    }

    .empty {
      padding: 26px 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
      border: 1px dashed #dcded2;
      border-radius: 5px;
      background: #fffefa;
    }

    /* =========================================
       6. MAP & LEAFLET POPUPS
       ========================================= */
    .map-wrap {
      position: relative;
      min-height: 520px;
      background: #eeebe3;
      border-radius: 5px;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 100px);
      background: #e9e7df;
    }

    .map-note {
      position: absolute;
      z-index: 500;
      left: 16px;
      top: 16px;
      background: rgba(255, 254, 250, 0.96);
      border: 1px solid rgba(231, 224, 214, 0.9);
      border-radius: 4px;
      padding: 13px 16px;
      font-size: 11px;
      color: var(--muted);
      max-width: 230px;
      line-height: 1.7;
      box-shadow: var(--shadow);
    }

    .leaflet-popup-content-wrapper {
      border-radius: 5px;
      background: var(--card);
      border: 1px solid #e5e3da;
      box-shadow: 0 5px 20px rgba(37, 37, 29, 0.07);
    }

    .leaflet-popup-content {
      font-family: inherit;
      min-width: 180px;
    }

    .popup-name {
      font-weight: 700;
      font-size: 14px;
    }

    .popup-rating {
      color: #777d58;
      font-size: 12px;
      margin: 5px 0;
    }

    .popup-review {
      font-size: 12px;
      line-height: 1.5;
      color: #555;
    }

    /* Custom Vintage Pin */
    .custom-pin {
      position: relative;
      width: 25px;
      height: 25px;
      background: #843D3D;
      border: 2px solid #F3EBDD;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 2px 4px rgba(41, 41, 35, 0.35), 0 0 0 1px rgba(132, 61, 61, 0.25);
    }

    .custom-pin::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      background: #F3EBDD;
      border-radius: 50%;
      top: 7px;
      left: 7px;
    }

    /* =========================================
       7. EDITORIAL INTRO SECTION
       ========================================= */
    .night-intro {
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
      padding: 24px 20px 18px;
      color: #f8f2e8;
      background: radial-gradient(ellipse at 100% 0%, #514b3d 0%, transparent 45%), #20221d;
      border: 1px solid #34372d;
      border-radius: 5px;
      box-shadow: 5px 5px 0 var(--night-accent);
    }

    .night-eyebrow {
      display: inline-block;
      color: var(--night-accent);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.22em;
    }

    .night-index {
      margin: 12px 0 20px;
      color: #c8c9bf;
      font-size: 9px;
      letter-spacing: 0.13em;
    }

    .night-intro h2 {
      margin: 0 0 14px;
      color: #fff9ef;
      font-family: sans-serif;
      font-size: clamp(24px, 2.2vw, 31px);
      font-weight: 900;
      line-height: 1.35;
      letter-spacing: -0.075em;
    }

    .night-description {
      margin: 0 0 20px;
      color: #d5d7cd;
      font-size: 12px;
      line-height: 1.9;
      word-break: keep-all;
    }

    .night-actions {
      display: grid;
      gap: 8px;
    }

    .night-actions button:not(.secondary) {
      width: 100%;
      min-height: 44px;
      border-color: var(--night-accent);
      background: var(--night-accent);
      color: var(--night-ink);
      font-weight: 900;
    }

    .night-actions button:not(.secondary):hover {
      border-color: #d8a18e;
      background: #d8a18e;
      color: #292621;
    }

    .night-actions button.secondary {
      border-color: #77796e;
      background: transparent;
      color: #f8f2e8;
    }

    .night-actions button.secondary:hover {
      background: #50413a;
    }

    .night-footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid #505349;
      color: var(--night-accent);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    /* =========================================
       8. MODAL & FORM CONTROLS
       ========================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(25, 23, 20, 0.58);
      backdrop-filter: blur(5px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      background: var(--card);
      width: min(560px, 100%);
      max-height: 92vh;
      overflow: auto;
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.16);
    }

    .modal h2 {
      font-size: 28px;
      line-height: 1.35;
      margin: 0 0 5px;
    }

    .modal p {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .field input, .field textarea, .field select {
      width: 100%;
      min-height: 44px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      font-family: inherit;
      font-size: 13px;
      transition: border-color 0.2s ease;
    }

    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: var(--accent);
      outline: none;
    }

    .field textarea {
      min-height: 100px;
      resize: vertical;
      line-height: 1.7;
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }

    .right-actions {
      display: flex;
      gap: 8px;
    }

    .hint {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.6;
      margin-top: 12px;
    }

    /* =========================================
       9. CALENDAR & COMMUNITY PANEL
       ========================================= */
    #calendarPanel {
      width: 100%;
      max-width: 980px !important;
      padding: clamp(18px, 4vw, 40px) !important;
      text-align: center;
    }

    #calendarPanel > h2 {
      margin-top: 24px;
      font-size: clamp(25px, 4vw, 34px);
      letter-spacing: -0.04em;
    }

    #calendarPanel > p {
      color: var(--muted);
      line-height: 1.8;
    }

    #calendarPanel > div[style*="border:1px solid #ddd"],
    #profileSection,
    #profileSection > div[style*="border:1px solid #ddd"] {
      border: 1px solid var(--line) !important;
      border-radius: 18px !important;
      background: var(--card);
      box-shadow: 0 4px 18px rgba(37, 35, 31, 0.025);
    }

    #calendarGrid {
      gap: 7px !important;
    }

    #calendarGrid button {
      min-width: 0;
      min-height: 66px;
      padding: 7px 2px;
      border: 1px solid var(--line) !important;
      border-radius: 12px;
      background: #fffdf9 !important;
      color: #302c28 !important;
      font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    #calendarGrid button:hover {
      border-color: var(--accent) !important;
      background: #f7eee9 !important;
      color: var(--ink) !important;
    }

    #calendarGrid button strong {
      color: #302c28 !important;
      font-size: 15px;
    }

    #calendarGrid button small {
      color: #71675e !important;
      font-size: 10px;
    }

    #calendarPanel input:not([type="checkbox"]),
    #calendarPanel select,
    #calendarPanel textarea {
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      text-align: center;
    }

    #calendarPanel input:not([type="checkbox"]),
    #calendarPanel select {
      min-height: 42px;
      padding: 10px 12px;
    }

    #calendarPanel textarea {
      padding: 12px;
      line-height: 1.7;
    }

    #calendarPanel input[type="checkbox"] {
      accent-color: var(--accent);
    }

    #calendarPanel button {
      margin-left: auto;
      margin-right: auto;
    }

    #profileLocationMap {
      border: 1px solid var(--line) !important;
      border-radius: 14px !important;
    }

    /* =========================================
       10. DIRECT MESSAGES (DM DRAWER)
       ========================================= */
    .dm-launcher,
    .dm-launcher:hover,
    .dm-launcher:focus {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 99998;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 54px;
      padding: 0 20px;
      border: 1px solid #28251f;
      border-radius: 999px;
      background: #28251f;
      color: #fffdf8;
      box-shadow: 0 10px 28px rgba(38, 35, 30, 0.22);
      font-size: 13px;
      font-weight: 700;
    }

    .dm-launcher > span:first-child { font-size: 21px; line-height: 1; }
    .dm-launcher:hover { background: #a34532; border-color: #a34532; transform: translateY(-2px); }

    .dm-drawer {
      --dm-ink: #292720;
      --dm-muted: #837c72;
      --dm-paper: #f7f4ee;
      --dm-card: #fffdf9;
      --dm-line: #e8e1d7;
      --dm-accent: #a34532;

      position: fixed;
      inset: 0 0 0 auto;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      width: min(440px, 100vw);
      height: 100dvh;
      background: var(--dm-paper);
      color: var(--dm-ink);
      border-left: 1px solid var(--dm-line);
      box-shadow: -18px 0 55px rgba(37, 32, 25, 0.16);
      transform: translateX(105%);
      visibility: hidden;
      transition: transform 0.28s ease, visibility 0.28s ease;
      font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
      line-height: 1.5;
    }

    .dm-drawer.is-open { transform: translateX(0); visibility: visible; }
    .dm-header { display: flex; align-items: center; gap: 13px; padding: 22px 20px 18px; background: var(--dm-card); border-bottom: 1px solid var(--dm-line); flex-shrink: 0; }
    .dm-brand-mark { display: grid; place-items: center; width: 44px; height: 44px; flex: 0 0 44px; border-radius: 14px; background: #eee6da; color: var(--dm-accent); font-family: Georgia, serif; font-size: 23px; }
    .dm-header-copy { min-width: 0; flex: 1; }
    .dm-eyebrow, .dm-section-kicker { margin: 0 0 3px; color: var(--dm-accent); font-size: 9px; letter-spacing: 0.16em; font-weight: 800; }
    .dm-header-copy h3 { margin: 0; color: var(--dm-ink); font-family: Georgia, 'Noto Serif KR', serif; font-size: 25px; font-weight: 500; line-height: 1.2; letter-spacing: -0.04em; }
    .dm-header-subtitle { margin: 5px 0 0; color: var(--dm-muted); font-size: 11px; }
    .dm-close, .dm-close:hover { display: grid; place-items: center; width: 36px; min-height: 36px; padding: 0; border: 1px solid var(--dm-line); border-radius: 50%; background: transparent; color: var(--dm-ink); font-size: 24px; font-weight: 400; }
    .dm-drawer-content { overflow: auto; flex: 1; padding: 18px 16px 28px; }
    .dm-section { padding: 0 0 19px; }
    .dm-section-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
    .dm-section-heading h4 { margin: 0; color: var(--dm-ink); font-size: 15px; font-weight: 750; }
    .dm-refresh { min-height: 31px; padding: 5px 10px; background: transparent; color: var(--dm-muted); border: 1px solid var(--dm-line); border-radius: 999px; font-size: 10px; white-space: nowrap; }
    .dm-refresh:hover { background: #eee7dd; border-color: #d9cdbf; color: var(--dm-ink); }
    .dm-inbox { display: grid; gap: 7px; }
    .dm-conversation { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 72px; padding: 12px; text-align: left; background: var(--dm-card); color: var(--dm-ink); border: 1px solid var(--dm-line); border-radius: 14px; box-shadow: 0 2px 8px rgba(38, 35, 30, 0.025); }
    .dm-conversation:hover, .dm-conversation.is-active { background: #fffaf2; border-color: #cbb9a6; color: var(--dm-ink); }
    .dm-avatar { display: grid; place-items: center; width: 43px; height: 43px; flex: 0 0 43px; border-radius: 50%; background: #e8d9c9; color: #65483b; font-weight: 800; font-size: 15px; }
    .dm-conversation-copy { min-width: 0; flex: 1; }
    .dm-conversation-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .dm-conversation-name { overflow: hidden; color: var(--dm-ink); font-size: 13px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
    .dm-conversation-time { color: var(--dm-muted); font-size: 9px; white-space: nowrap; }
    .dm-conversation-preview { overflow: hidden; margin-top: 4px; color: var(--dm-muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .dm-empty { display: flex; flex-direction: column; align-items: center; padding: 23px 17px; border: 1px dashed #dcd2c5; border-radius: 14px; text-align: center; background: rgba(255, 253, 249, 0.55); }
    .dm-empty-icon { display: grid; place-items: center; width: 42px; height: 42px; margin-bottom: 9px; border-radius: 50%; background: #eee6da; color: var(--dm-accent); font-size: 21px; }
    .dm-empty strong { color: var(--dm-ink); font-size: 12px; }
    .dm-empty p { max-width: 260px; margin: 5px 0 0; color: var(--dm-muted); font-size: 11px; line-height: 1.7; }
    .dm-thread { overflow: hidden; display: flex; flex-direction: column; margin: 0 0 20px; border: 1px solid var(--dm-line); border-radius: 16px; background: var(--dm-card); box-shadow: 0 5px 18px rgba(38, 35, 30, 0.045); }
    .dm-thread-header { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid var(--dm-line); background: #fffaf4; }
    .dm-back, .dm-back:hover { display: grid; place-items: center; min-height: 32px; width: 32px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--dm-ink); font-size: 19px; }
    .dm-thread-avatar { width: 38px; height: 38px; flex-basis: 38px; }
    .dm-thread-heading-copy { min-width: 0; }
    .dm-thread-heading-copy h4 { overflow: hidden; margin: 0; color: var(--dm-ink); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .dm-thread-heading-copy p { margin: 2px 0 0; color: var(--dm-muted); font-size: 10px; }
    .dm-messages { display: flex; flex-direction: column; gap: 10px; min-height: 130px; max-height: 320px; overflow-y: auto; padding: 15px 12px; background: #f9f6f0; overflow-wrap: anywhere; }
    .dm-message-row { display: flex; flex-direction: column; align-items: flex-start; max-width: 88%; }
    .dm-message-row.is-mine { align-self: flex-end; align-items: flex-end; }
    .dm-message-sender { margin: 0 0 4px 3px; color: var(--dm-muted); font-size: 9px; }
    .dm-message-bubble { padding: 10px 12px; border: 1px solid #e8e0d5; border-radius: 4px 15px 15px 15px; background: #fffdf9; color: #302c27; font-size: 12px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 2px rgba(40, 30, 20, 0.03); }
    .dm-message-row.is-mine .dm-message-bubble { border-color: #e7cfc2; border-radius: 15px 4px 15px 15px; background: #f2dfd4; color: #382923; }
    .dm-message-time { margin: 4px 3px 0; color: #968d82; font-size: 9px; }
    .dm-no-messages { margin: auto; padding: 25px 10px; color: var(--dm-muted); font-size: 11px; text-align: center; }
    .dm-composer { display: flex; align-items: flex-end; gap: 8px; padding: 11px; border-top: 1px solid var(--dm-line); background: var(--dm-card); }
    .dm-composer textarea { display: block; flex: 1; min-width: 0; min-height: 42px; max-height: 120px; resize: vertical; padding: 11px 13px; border: 1px solid #ded5c9; border-radius: 16px; outline: none; background: #f8f5ef; color: #292720; font: inherit; font-size: 12px; line-height: 1.5; }
    .dm-composer textarea::placeholder { color: #9a9186; }
    .dm-composer textarea:focus { border-color: #b98b78; box-shadow: 0 0 0 3px rgba(163, 69, 50, 0.08); }
    .dm-composer button, .dm-composer button:hover { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 13px; border: 0; border-radius: 14px; background: #292720; color: #fffdf8; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .dm-composer button span:last-child { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: #fffdf8; color: #292720; font-size: 14px; }
    .dm-composer-hint { margin: 0; padding: 0 12px 10px; color: #a0988e; background: var(--dm-card); font-size: 9px; }
    .dm-people-section { padding-top: 17px; border-top: 1px solid var(--dm-line); }
    .dm-section-description { margin: -4px 0 10px; color: var(--dm-muted); font-size: 11px; line-height: 1.65; }
    .dm-people-list { display: grid; gap: 7px; }
    .dm-person-row { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--dm-line); border-radius: 12px; background: var(--dm-card); }
    .dm-person-copy { flex: 1; min-width: 0; }
    .dm-person-name { display: block; overflow: hidden; color: var(--dm-ink); font-size: 12px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
    .dm-person-caption { display: block; margin-top: 2px; color: var(--dm-muted); font-size: 10px; }
    .dm-person-message, .dm-person-message:hover { min-height: 32px; padding: 6px 10px; border: 1px solid #d8c7b8; border-radius: 999px; background: #fffaf4; color: #65483b; font-size: 10px; white-space: nowrap; }
    .dm-status { min-height: 16px; margin: 8px 2px 0; color: #746b61; font-size: 10px; line-height: 1.5; overflow-wrap: anywhere; }
    .dm-status:empty { display: none; }
    .dm-inbox .dm-empty:not(:first-child) { display: none; }
    .dm-drawer button:focus-visible, .dm-drawer textarea:focus-visible, .dm-launcher:focus-visible { outline: 2px solid #a34532; outline-offset: 3px; }
